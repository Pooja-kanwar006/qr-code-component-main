<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    html {
      background-color: rgb(199, 215, 215);
    }

    .container {
    
    width: 220px;
    height: 350px;
    text-align: center;
   margin-left: 43%;
  margin-top: 10%;
  
  background-color: rgba(255, 255, 255, 0.715);
  border-radius: 5%;
    }
  
   img{
   width: fit;
   margin-top:9px;
   margin-bottom: 10px;}
   p{ margin: 9px;
  }
   .p1{
   font-size: small;
   font-weight: 500;
  margin-bottom: 23px;
   }
   .p2{
   font-size:x-small;
   font-weight: 100;}
   .attribution{margin-top: 40px;
   text-align: center;}
  </style>
</head>

<body>
  <div class="container">
    <img  height="190px" src="./images/image-qr-code.png">
    <p class="p1">Improve your front-end skills by building projects</p>

    <p class="p2">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
  </div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Pooja kanwar</a>.
  </footer>
</body>

</html>
